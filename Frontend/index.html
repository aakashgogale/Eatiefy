<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/user-app-logo.webp" />
    <link rel="alternate icon" type="image/png" href="/assets/images/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"></noscript>
    <title>Eatiefy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800&display=swap">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"></noscript>
  </head>
  <body> 
    <div id="root"></div>
    <script>
      // Dev-only diagnostics. Never wipe React root via innerHTML (breaks the app).
      (function () {
        var isLocal =
          location.hostname === "localhost" ||
          location.hostname === "127.0.0.1" ||
          location.hostname === "[::1]";

        function isBenignRejection(reason) {
          if (!reason) return true;
          var msg = String(reason && reason.message ? reason.message : reason);
          var code = reason && reason.code;
          var name = reason && reason.name;
          return (
            name === "AxiosError" ||
            code === "ECONNABORTED" ||
            code === "ERR_NETWORK" ||
            msg.indexOf("timeout") !== -1 ||
            msg.indexOf("Network Error") !== -1 ||
            msg.indexOf("Failed to fetch") !== -1
          );
        }

        function showBanner(title, detail) {
          if (!isLocal) return;
          var el = document.createElement("div");
          el.setAttribute("data-eatiefy-debug-banner", "1");
          el.style.cssText =
            "position:fixed;top:0;left:0;right:0;background:#b91c1c;color:#fff;padding:12px 16px;z-index:999999;font:14px/1.4 system-ui,sans-serif;max-height:40vh;overflow:auto";
          el.innerHTML = "<b>" + title + "</b> " + String(detail || "");
          document.body.appendChild(el);
        }

        window.addEventListener("error", function (e) {
          if (!isLocal) return;
          showBanner("Runtime Error:", e.message || "Unknown error");
        });

        window.addEventListener("unhandledrejection", function (e) {
          if (isBenignRejection(e.reason)) {
            e.preventDefault();
            return;
          }
          if (!isLocal) {
            e.preventDefault();
            return;
          }
          showBanner("Unhandled Promise Rejection:", e.reason);
        });
      })();
    </script>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
